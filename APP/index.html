<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiCurriculum</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/cv.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name" data-text="appName"></span>
      <span class="brand-version"><span data-text="versionLabel"></span> <span data-text="version"></span></span>
    </div>
    <div class="actions" id="actions"></div>
  </header>

  <main class="workspace">
    <section class="panel" id="form-panel" aria-labelledby="form-title">
      <h2 class="panel-title" id="form-title" data-text="formTitle"></h2>
      <div id="form"></div>
    </section>

    <section class="preview" id="preview" aria-labelledby="preview-title">
      <h2 class="visually-hidden" id="preview-title" data-text="previewTitle"></h2>
      <div class="notice" id="notice" role="alert" hidden>
        <p class="notice-text"></p>
        <button type="button" class="icon-button notice-close" id="notice-close">×</button>
      </div>
      <p class="sheet-warning" id="sheet-warning" role="status" data-text="sheetOverflow" hidden></p>
      <div class="sheet-frame" id="sheet-frame">
        <div class="sheet" id="sheet"></div>
      </div>
    </section>
  </main>

  <script src="js/texts.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/svg-clean.js"></script>
  <script src="js/render.js"></script>
  <script src="js/state.js"></script>
  <script src="js/form.js"></script>
  <script src="js/fit.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
